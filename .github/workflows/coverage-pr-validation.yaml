name: Coverage PR Validation

on:
  push:
    branches:
      - fix/sonarcloud-coverage-collection

concurrency:
  group: coverage-pr-validation
  cancel-in-progress: true

env:
  KVROCKS_DEPS_CACHE_DIR: build-deps
  SONARCLOUD_OUTPUT_DIR: sonarcloud-data

jobs:
  sonarcloud:
    name: SonarCloud with Coverage
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Setup Linux
        run: |
          sudo apt update
          sudo apt install -y ninja-build
          echo "NPROC=$(nproc)" >> $GITHUB_ENV

      - name: Cache redis
        id: cache-redis
        uses: actions/cache@v5
        with:
          path: ~/local/bin/redis-cli
          key: ubuntu-22.04-redis-cli

      - name: Cache redis server
        id: cache-redis-server
        uses: actions/cache@v5
        with:
          path: ~/local/bin/redis-server
          key: ubuntu-22.04-redis-server

      - name: Install redis
        if: ${{ steps.cache-redis.outputs.cache-hit != 'true' || steps.cache-redis-server.outputs.cache-hit != 'true' }}
        run: |
          curl -O https://download.redis.io/releases/redis-6.2.14.tar.gz
          tar -xzvf redis-6.2.14.tar.gz
          mkdir -p $HOME/local/bin
          pushd redis-6.2.14
          BUILD_TLS=yes make -j$NPROC redis-cli
          mv src/redis-cli $HOME/local/bin/
          popd
          pushd redis-6.2.14
          BUILD_TLS=yes make -j$NPROC redis-server
          mv src/redis-server $HOME/local/bin/
          popd

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore Kvrocks dependency cache
        id: cache-kvrocks-deps
        uses: actions/cache@v5
        with:
          path: ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          key: kvrocks-full-deps-${{ hashFiles('x.py', 'CMakeLists.txt', 'cmake/**/*.cmake') }}
          enableCrossOsArchive: true

      - name: Fetch Kvrocks dependencies
        if: ${{ steps.cache-kvrocks-deps.outputs.cache-hit != 'true' }}
        run: ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - uses: actions/setup-go@v6
        with:
          go-version-file: tests/gocase/go.mod
          cache: false

      - name: Install gcovr 5.0
        run: pip install gcovr==5.0

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@713881670b6b3676cda39549040e2d88c70d582e

      - name: Build unittest first
        run: |
          build-wrapper-linux-x86-64 --out-dir ${{ env.SONARCLOUD_OUTPUT_DIR }} ./x.py build -j$NPROC --compiler gcc --skip-build --dep-dir ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          cp -r build _build
          ./x.py build -j$NPROC --compiler gcc -DCMAKE_CXX_FLAGS=--coverage --skip-build --dep-dir ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          cmake --build build --parallel $NPROC --target unittest

      - name: Run C++ unit tests
        run: |
          ulimit -c unlimited
          ./x.py test cpp

      - name: Collect C++ unit test coverage
        run: |
          gcovr --json -o "${RUNNER_TEMP}/cpp-coverage.json"
          find build -name '*.gcda' -delete

      - name: Build Kvrocks for integration tests
        run: |
          build-wrapper-linux-x86-64 --out-dir ${{ env.SONARCLOUD_OUTPUT_DIR }} cmake --build build --parallel $NPROC --target kvrocks

      - name: Run full Go integration tests
        run: |
          ulimit -c unlimited
          export PATH=$PATH:$HOME/local/bin/
          ./x.py test go build -parallel 2

      - name: Collect and validate merged coverage
        run: |
          gcovr --json -o "${RUNNER_TEMP}/go-coverage.json"
          gcovr --add-tracefile "${RUNNER_TEMP}/cpp-coverage.json" \
            --add-tracefile "${RUNNER_TEMP}/go-coverage.json" \
            --sonarqube > ${{ env.SONARCLOUD_OUTPUT_DIR }}/coverage.xml

          covered=$(jq '[.files[]
            | select(.file == "src/commands/cmd_hash.cc")
            | .lines[]
            | select((."gcovr/noncode" | not) and .count > 0)] | length'             "${RUNNER_TEMP}/go-coverage.json")
          echo "cmd_hash.cc covered lines: ${covered}"
          test "${covered}" -gt 500

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pr-validation
          path: |
            ${{ env.SONARCLOUD_OUTPUT_DIR }}/coverage.xml
            ${{ runner.temp }}/cpp-coverage.json
            ${{ runner.temp }}/go-coverage.json
