name: Coverage Profile Diagnostic

on:
  push:
    branches:
      - codex/coverage-profile-diagnostic-20260812
  workflow_dispatch:

concurrency:
  group: coverage-profile-diagnostic
  cancel-in-progress: true

env:
  KVROCKS_DEPS_CACHE_DIR: build-deps

jobs:
  diagnose:
    name: Verify test-before-server coverage collection
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Kvrocks dependency cache
        id: cache-kvrocks-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          key: coverage-diagnostic-deps-${{ hashFiles('x.py', 'CMakeLists.txt', 'cmake/**/*.cmake') }}

      - name: Fetch Kvrocks dependencies
        if: ${{ steps.cache-kvrocks-deps.outputs.cache-hit != 'true' }}
        run: ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/gocase/go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install diagnostic tools
        run: pip install gcovr==5.0

      - name: Configure coverage build
        run: ./x.py build --skip-build --compiler gcc -DCMAKE_CXX_FLAGS=--coverage --dep-dir ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - name: Build unittest first
        shell: bash
        run: |
          set -euo pipefail
          started=${SECONDS}
          cmake --build build --parallel "$(nproc)" --target unittest
          printf 'build_unittest_seconds\t%s\n' "$((SECONDS - started))" | tee build-times.tsv
          find build/CMakeFiles/kvrocks_objs.dir -type f \
            \( -name '*.o' -o -name '*.gcno' \) -print0 \
            | sort -z | xargs -0 sha256sum > kvrocks-objs-after-unittest.sha256

      - name: Run C++ tests and capture matching profile
        shell: bash
        run: |
          set -euo pipefail
          started=${SECONDS}
          ./x.py test cpp
          printf 'cpp_tests_seconds\t%s\n' "$((SECONDS - started))" | tee -a build-times.tsv
          started=${SECONDS}
          gcovr --root . --filter '^src/' --json -o cpp.json
          printf 'cpp_report_seconds\t%s\n' "$((SECONDS - started))" | tee -a build-times.tsv
          find build -name '*.gcda' -delete

      - name: Build kvrocks after capturing C++ coverage
        shell: bash
        run: |
          set -euo pipefail
          started=${SECONDS}
          cmake --build build --parallel "$(nproc)" --target kvrocks
          printf 'build_kvrocks_incremental_seconds\t%s\n' "$((SECONDS - started))" | tee -a build-times.tsv
          find build/CMakeFiles/kvrocks_objs.dir -type f \
            \( -name '*.o' -o -name '*.gcno' \) -print0 \
            | sort -z | xargs -0 sha256sum > kvrocks-objs-after-kvrocks.sha256

          if diff -u kvrocks-objs-after-unittest.sha256 kvrocks-objs-after-kvrocks.sha256 > kvrocks-objs.diff; then
            printf 'kvrocks_objs_rebuilt\tfalse\n' | tee -a build-times.tsv
          else
            printf 'kvrocks_objs_rebuilt\ttrue\n' | tee -a build-times.tsv
          fi

      - name: Run Go hash package with matching server profile
        working-directory: tests/gocase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          started=${SECONDS}
          go test -count=1 -timeout=600s ./unit/type/hash \
            -binPath="${GITHUB_WORKSPACE}/build/kvrocks" \
            -cliPath=redis-cli \
            -workspace="${GITHUB_WORKSPACE}/tests/gocase/workspace" \
            -parallel 2
          printf 'go_hash_seconds\t%s\n' "$((SECONDS - started))" | tee -a "${GITHUB_WORKSPACE}/build-times.tsv"

      - name: Generate and merge coverage reports
        shell: bash
        run: |
          set -euo pipefail
          started=${SECONDS}
          gcovr --root . --filter '^src/' --json -o go.json
          printf 'go_report_seconds\t%s\n' "$((SECONDS - started))" | tee -a build-times.tsv

          started=${SECONDS}
          gcovr --add-tracefile cpp.json \
            --add-tracefile go.json \
            --sonarqube -o coverage.xml
          printf 'merge_report_seconds\t%s\n' "$((SECONDS - started))" | tee -a build-times.tsv

          for report in cpp go; do
            jq -r --arg report "${report}" '
              .files[]
              | select(.file == "src/commands/cmd_hash.cc"
                    or .file == "src/types/redis_hash.cc"
                    or .file == "src/server/server.cc"
                    or .file == "src/cli/main.cc")
              | [$report, .file,
                 ([.lines[] | select(."gcovr/noncode" | not)] | length),
                 ([.lines[] | select((."gcovr/noncode" | not) and .count > 0)] | length)]
              | @tsv
            ' "${report}.json"
          done | tee coverage-comparison.tsv

          cat build-times.tsv
          cat coverage-comparison.tsv

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-before-server
          path: |
            build-times.tsv
            kvrocks-objs-after-unittest.sha256
            kvrocks-objs-after-kvrocks.sha256
            kvrocks-objs.diff
            cpp.json
            go.json
            coverage.xml
            coverage-comparison.tsv
