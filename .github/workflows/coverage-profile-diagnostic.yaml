name: Coverage Profile Diagnostic

on:
  push:
    branches:
      - codex/coverage-profile-diagnostic-20260812
  workflow_dispatch:

concurrency:
  group: coverage-profile-diagnostic
  cancel-in-progress: true

env:
  KVROCKS_DEPS_CACHE_DIR: build-deps

jobs:
  diagnose:
    name: Verify single-build profile isolation
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Kvrocks dependency cache
        id: cache-kvrocks-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          key: coverage-diagnostic-deps-${{ hashFiles('x.py', 'CMakeLists.txt', 'cmake/**/*.cmake') }}

      - name: Fetch Kvrocks dependencies
        if: ${{ steps.cache-kvrocks-deps.outputs.cache-hit != 'true' }}
        run: ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/gocase/go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install diagnostic tools
        run: pip install gcovr==5.0

      - name: Configure coverage build
        run: ./x.py build --skip-build --compiler gcc -DCMAKE_CXX_FLAGS=--coverage --dep-dir ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - name: Build kvrocks and unittest sequentially
        shell: bash
        run: |
          set -euo pipefail

          started=${SECONDS}
          cmake --build build --parallel "$(nproc)" --target kvrocks
          printf 'build_kvrocks_seconds\t%s\n' "$((SECONDS - started))" | tee build-times.tsv

          find build/CMakeFiles/kvrocks_objs.dir -type f \
            \( -name '*.o' -o -name '*.gcno' \) -print0 \
            | sort -z | xargs -0 sha256sum > kvrocks-objs-before-unittest.sha256

          started=${SECONDS}
          cmake --build build --parallel "$(nproc)" --target unittest
          printf 'build_unittest_incremental_seconds\t%s\n' "$((SECONDS - started))" | tee -a build-times.tsv

          find build/CMakeFiles/kvrocks_objs.dir -type f \
            \( -name '*.o' -o -name '*.gcno' \) -print0 \
            | sort -z | xargs -0 sha256sum > kvrocks-objs-after-unittest.sha256

          if diff -u kvrocks-objs-before-unittest.sha256 kvrocks-objs-after-unittest.sha256 > kvrocks-objs.diff; then
            printf 'kvrocks_objs_rebuilt\tfalse\n' | tee -a build-times.tsv
          else
            printf 'kvrocks_objs_rebuilt\ttrue\n' | tee -a build-times.tsv
            cat kvrocks-objs.diff
          fi

      - name: Run Go hash package after both targets are built
        working-directory: tests/gocase
        run: |
          find "${GITHUB_WORKSPACE}/build" -name '*.gcda' -delete
          mkdir -p workspace
          go test -count=1 -timeout=600s ./unit/type/hash \
            -binPath="${GITHUB_WORKSPACE}/build/kvrocks" \
            -cliPath=redis-cli \
            -workspace="${GITHUB_WORKSPACE}/tests/gocase/workspace" \
            -parallel 2

      - name: Capture non-isolated Go profile
        run: |
          gcovr --root . --filter '^src/' --json -o go-after-both-built.json
          find build -name '*.gcda' -printf '%s\t%p\n' | sort > go-after-both-built-profiles.txt

      - name: Run C++ tests in an isolated profile directory
        shell: bash
        run: |
          set -euo pipefail
          find build -name '*.gcda' -delete
          mkdir -p profiles/cpp
          profile_strip=$(awk -F/ '{print NF - 1}' <<< "${GITHUB_WORKSPACE}")
          started=${SECONDS}
          GCOV_PREFIX="${GITHUB_WORKSPACE}/profiles/cpp" \
          GCOV_PREFIX_STRIP="${profile_strip}" \
            ./x.py test cpp
          printf 'cpp_tests_seconds\t%s\n' "$((SECONDS - started))" | tee -a build-times.tsv

      - name: Run Go hash package in a separate profile directory
        working-directory: tests/gocase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/profiles/go" workspace
          profile_strip=$(awk -F/ '{print NF - 1}' <<< "${GITHUB_WORKSPACE}")
          started=${SECONDS}
          GCOV_PREFIX="${GITHUB_WORKSPACE}/profiles/go" \
          GCOV_PREFIX_STRIP="${profile_strip}" \
            go test -count=1 -timeout=600s ./unit/type/hash \
              -binPath="${GITHUB_WORKSPACE}/build/kvrocks" \
              -cliPath=redis-cli \
              -workspace="${GITHUB_WORKSPACE}/tests/gocase/workspace" \
              -parallel 2
          printf 'go_hash_isolated_seconds\t%s\n' "$((SECONDS - started))" | tee -a "${GITHUB_WORKSPACE}/build-times.tsv"

      - name: Generate and merge isolated coverage reports
        shell: bash
        run: |
          set -euo pipefail

          find profiles/cpp -name '*.gcda' -printf '%s\t%p\n' | sort > cpp-isolated-profiles.txt
          find profiles/go -name '*.gcda' -printf '%s\t%p\n' | sort > go-isolated-profiles.txt

          find build -name '*.gcda' -delete
          cp -a profiles/cpp/build/. build/
          gcovr --root . --filter '^src/' --json -o cpp-isolated.json

          find build -name '*.gcda' -delete
          cp -a profiles/go/build/. build/
          gcovr --root . --filter '^src/' --json -o go-isolated.json

          gcovr --add-tracefile cpp-isolated.json \
            --add-tracefile go-isolated.json \
            --sonarqube -o coverage-isolated.xml

          for report in go-after-both-built cpp-isolated go-isolated; do
            jq -r --arg report "${report}" '
              .files[]
              | select(.file == "src/commands/cmd_hash.cc"
                    or .file == "src/types/redis_hash.cc"
                    or .file == "src/server/server.cc"
                    or .file == "src/cli/main.cc")
              | [$report, .file,
                 ([.lines[] | select(."gcovr/noncode" | not)] | length),
                 ([.lines[] | select((."gcovr/noncode" | not) and .count > 0)] | length)]
              | @tsv
            ' "${report}.json"
          done | tee coverage-comparison.tsv

          cat build-times.tsv
          cat coverage-comparison.tsv

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-single-build-isolation
          path: |
            build-times.tsv
            kvrocks-objs-before-unittest.sha256
            kvrocks-objs-after-unittest.sha256
            kvrocks-objs.diff
            go-after-both-built.json
            cpp-isolated.json
            go-isolated.json
            coverage-isolated.xml
            go-after-both-built-profiles.txt
            cpp-isolated-profiles.txt
            go-isolated-profiles.txt
            coverage-comparison.tsv
