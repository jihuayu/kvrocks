name: Coverage Profile Diagnostic

on:
  push:
    branches:
      - codex/coverage-profile-diagnostic-20260812
  workflow_dispatch:

concurrency:
  group: coverage-profile-diagnostic
  cancel-in-progress: true

env:
  KVROCKS_DEPS_CACHE_DIR: build-deps

jobs:
  diagnose:
    name: Trace one instrumented kvrocks process
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Kvrocks dependency cache
        id: cache-kvrocks-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          key: coverage-diagnostic-deps-${{ hashFiles('x.py', 'CMakeLists.txt', 'cmake/**/*.cmake') }}

      - name: Fetch Kvrocks dependencies
        if: ${{ steps.cache-kvrocks-deps.outputs.cache-hit != 'true' }}
        run: ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
          pip install gcovr==5.0

      - name: Build one coverage binary
        run: |
          ./x.py build --skip-build --compiler gcc -DCMAKE_CXX_FLAGS=--coverage --dep-dir ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          cmake --build build --parallel $(nproc) --target kvrocks
          grep -F -- '--coverage' build/compile_commands.json | grep -F 'src/commands/cmd_hash.cc' > cmd-hash-compile-command.txt

      - name: Exercise one server process
        shell: bash
        run: |
          set -euo pipefail
          run_dir="${RUNNER_TEMP}/kvrocks-coverage-single"
          mkdir -p "${run_dir}"
          ./build/kvrocks             --bind 127.0.0.1             --port 56666             --dir "${run_dir}"             --log-dir stderr             > single-process.stdout 2> single-process.stderr &
          kvrocks_pid=$!

          stop_server() {
            if kill -0 "${kvrocks_pid}" 2>/dev/null; then
              kill -TERM "${kvrocks_pid}"
              wait "${kvrocks_pid}"
            fi
          }
          trap stop_server EXIT

          ready=false
          for _ in {1..120}; do
            if redis-cli -h 127.0.0.1 -p 56666 ping >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.25
          done
          test "${ready}" = true

          test "$(redis-cli -h 127.0.0.1 -p 56666 hset codex-coverage field value)" = 1
          test "$(redis-cli -h 127.0.0.1 -p 56666 hget codex-coverage field)" = value
          test "$(redis-cli -h 127.0.0.1 -p 56666 hlen codex-coverage)" = 1

          kill -TERM "${kvrocks_pid}"
          wait "${kvrocks_pid}"
          trap - EXIT

      - name: Inspect raw profiles
        shell: bash
        run: |
          find build -name '*.gcda' -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' | sort > profile-inventory.txt
          find build -name '*.gcda' | sort | grep -E 'cmd_hash|redis_hash|server\.cc|main\.cc' > relevant-profiles.txt || true

          gcovr --root . --filter '^src/' --json -o single-process.json
          gcovr --add-tracefile single-process.json --filter '^src/commands/cmd_hash\\.cc$' --txt > cmd-hash-coverage.txt
          gcovr --add-tracefile single-process.json --filter '^src/types/redis_hash\\.cc$' --txt > redis-hash-coverage.txt
          gcovr --add-tracefile single-process.json --filter '^src/server/server\\.cc$' --txt > server-coverage.txt
          gcovr --add-tracefile single-process.json --filter '^src/cli/main\\.cc$' --txt > main-coverage.txt

          cat relevant-profiles.txt
          cat cmd-hash-coverage.txt
          cat redis-hash-coverage.txt
          cat server-coverage.txt
          cat main-coverage.txt
          cat single-process.stderr

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-single-process-diagnostic
          path: |
            single-process.json
            profile-inventory.txt
            relevant-profiles.txt
            cmd-hash-compile-command.txt
            cmd-hash-coverage.txt
            redis-hash-coverage.txt
            server-coverage.txt
            main-coverage.txt
            single-process.stdout
            single-process.stderr
