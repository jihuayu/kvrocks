name: Coverage Profile Diagnostic

on:
  push:
    branches:
      - codex/coverage-profile-diagnostic-20260812
  workflow_dispatch:

concurrency:
  group: coverage-profile-diagnostic
  cancel-in-progress: true

env:
  KVROCKS_DEPS_CACHE_DIR: build-deps

jobs:
  diagnose:
    name: Compare repeated process profile writes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Kvrocks dependency cache
        id: cache-kvrocks-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          key: coverage-diagnostic-deps-${{ hashFiles('x.py', 'CMakeLists.txt', 'cmake/**/*.cmake') }}

      - name: Fetch Kvrocks dependencies
        if: ${{ steps.cache-kvrocks-deps.outputs.cache-hit != 'true' }}
        run: ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/gocase/go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
          pip install gcovr==5.0

      - name: Build coverage binary
        run: |
          ./x.py build --skip-build --compiler gcc -DCMAKE_CXX_FLAGS=--coverage --dep-dir ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          cmake --build build --parallel $(nproc) --target kvrocks

      - name: Run repeated servers sequentially
        shell: bash
        run: |
          set -euo pipefail
          base_dir="${RUNNER_TEMP}/kvrocks-coverage-sequential"
          mkdir -p "${base_dir}"

          for instance in $(seq 1 61); do
            run_dir="${base_dir}/${instance}"
            mkdir -p "${run_dir}"
            ./build/kvrocks               --bind 127.0.0.1               --port 56666               --dir "${run_dir}"               --log-dir stderr               > "${run_dir}/stdout" 2> "${run_dir}/stderr" &
            kvrocks_pid=$!

            ready=false
            for _ in {1..120}; do
              if redis-cli -h 127.0.0.1 -p 56666 ping >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 0.1
            done
            test "${ready}" = true

            test "$(redis-cli -h 127.0.0.1 -p 56666 hset codex-coverage field value)" = 1
            test "$(redis-cli -h 127.0.0.1 -p 56666 hget codex-coverage field)" = value
            kill -TERM "${kvrocks_pid}"
            wait "${kvrocks_pid}"
          done

      - name: Capture sequential profile
        run: |
          gcovr --root . --filter '^src/' --json -o sequential.json
          find build -name '*.gcda' -printf '%s\t%p\n' | sort > sequential-profiles.txt
          find "${RUNNER_TEMP}/kvrocks-coverage-sequential" -name stderr -exec grep -H 'libgcov' {} + > sequential-libgcov-errors.txt || true

      - name: Run servers concurrently
        shell: bash
        run: |
          set -euo pipefail
          find build -name '*.gcda' -delete
          base_dir="${RUNNER_TEMP}/kvrocks-coverage-concurrent"
          mkdir -p "${base_dir}"
          declare -a pids=()

          for instance in $(seq 1 16); do
            port=$((57000 + instance))
            run_dir="${base_dir}/${instance}"
            mkdir -p "${run_dir}"
            ./build/kvrocks               --bind 127.0.0.1               --port "${port}"               --dir "${run_dir}"               --log-dir stderr               > "${run_dir}/stdout" 2> "${run_dir}/stderr" &
            pids+=("$!")
          done

          for instance in $(seq 1 16); do
            port=$((57000 + instance))
            ready=false
            for _ in {1..120}; do
              if redis-cli -h 127.0.0.1 -p "${port}" ping >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 0.1
            done
            test "${ready}" = true
            test "$(redis-cli -h 127.0.0.1 -p "${port}" hset codex-coverage field value)" = 1
            test "$(redis-cli -h 127.0.0.1 -p "${port}" hget codex-coverage field)" = value
          done

          for pid in "${pids[@]}"; do kill -TERM "${pid}"; done
          for pid in "${pids[@]}"; do wait "${pid}"; done

      - name: Capture concurrent profile
        run: |
          gcovr --root . --filter '^src/' --json -o concurrent.json
          find build -name '*.gcda' -printf '%s\t%p\n' | sort > concurrent-profiles.txt
          find "${RUNNER_TEMP}/kvrocks-coverage-concurrent" -name stderr -exec grep -H 'libgcov' {} + > concurrent-libgcov-errors.txt || true

      - name: Run isolated Go hash package
        working-directory: tests/gocase
        run: |
          find "${GITHUB_WORKSPACE}/build" -name '*.gcda' -delete
          mkdir -p workspace
          go test -count=1 -timeout=600s ./unit/type/hash             -binPath="${GITHUB_WORKSPACE}/build/kvrocks"             -cliPath=redis-cli             -workspace="${GITHUB_WORKSPACE}/tests/gocase/workspace"             -parallel 2

      - name: Capture Go package profile and errors
        shell: bash
        run: |
          gcovr --root . --filter '^src/' --json -o go-hash.json
          find build -name '*.gcda' -printf '%s\t%p\n' | sort > go-hash-profiles.txt
          find tests/gocase/workspace -name stderr -exec grep -H 'libgcov' {} + > go-hash-libgcov-errors.txt || true
          find tests/gocase/workspace -name stderr -exec sh -c 'for log_file do printf "===== %s\n" "${log_file}"; cat "${log_file}"; done' sh {} + > go-hash-server-stderr.txt

          for report in sequential concurrent go-hash; do
            jq -r --arg report "${report}" '
              .files[]
              | select(.file == "src/commands/cmd_hash.cc"
                    or .file == "src/types/redis_hash.cc"
                    or .file == "src/server/server.cc"
                    or .file == "src/cli/main.cc")
              | [$report, .file,
                 ([.lines[] | select(."gcovr/noncode" | not)] | length),
                 ([.lines[] | select((."gcovr/noncode" | not) and .count > 0)] | length)]
              | @tsv
            ' "${report}.json"
          done | tee coverage-comparison.tsv

          cat sequential-libgcov-errors.txt
          cat concurrent-libgcov-errors.txt
          cat go-hash-libgcov-errors.txt
          cat coverage-comparison.tsv

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-multiprocess-diagnostic
          path: |
            sequential.json
            concurrent.json
            go-hash.json
            sequential-profiles.txt
            concurrent-profiles.txt
            go-hash-profiles.txt
            sequential-libgcov-errors.txt
            concurrent-libgcov-errors.txt
            go-hash-libgcov-errors.txt
            go-hash-server-stderr.txt
            coverage-comparison.tsv
