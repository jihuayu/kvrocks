name: CI Base Images

on:
  push:
    branches: [unstable, 'exp/ci-docker-3layer']
    paths: ['.github/docker/**', '.github/workflows/ci-images.yaml']
  workflow_dispatch:
    inputs:
      image:
        description: CI image to publish
        type: choice
        required: false
        default: all
        options:
          - all
          - alpine-3.22
          - archlinux
          - debian-12
          - lint-ubuntu-24.04
          - opensuse-15
          - riscv-ubuntu-24.04
          - rocky-8
          - rocky-9
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name != 'schedule' || github.repository == 'apache/kvrocks'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.image && inputs.image != 'all' && format('["{0}"]', inputs.image)
          || '["alpine-3.22","archlinux","debian-12","lint-ubuntu-24.04","opensuse-15","riscv-ubuntu-24.04","rocky-8","rocky-9"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image parameters
        id: image
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${OWNER}/kvrocks-ci/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          if [[ "$IMAGE_NAME" == 'lint-ubuntu-24.04' ]]; then
            GO_VERSION=$(awk '$1 == "go" { print $2; exit }' tests/gocase/go.mod)
            test -n "$GO_VERSION"
            GOLANGCI_LINT_VERSION=$(python3 -B -c 'import x; print(".".join(map(str, x.GOLANGCI_LINT_REQUIRED_VERSION)))')
            {
              echo 'build_args<<EOF'
              echo "GO_VERSION=$GO_VERSION"
              echo "GOLANGCI_LINT_VERSION=$GOLANGCI_LINT_VERSION"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/docker
          file: .github/docker/${{ matrix.name }}.Dockerfile
          platforms: linux/amd64
          build-args: ${{ steps.image.outputs.build_args }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.ref }}:latest
            ${{ steps.image.outputs.ref }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache,mode=max
